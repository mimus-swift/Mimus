name: CI

on: [pull_request]

jobs:
  build:

    runs-on: macos-26

    steps:
    - name: Check out repository
      uses: actions/checkout@v2
    - name: Executes tests
      run: |
        swift test
    - name: Installs Sourcery for generated verifier tests
      run: |
        curl --fail --location --retry 3 \
          https://github.com/krzysztofzablocki/Sourcery/releases/download/2.4.1/sourcery-2.4.1.zip \
          --output "$RUNNER_TEMP/sourcery.zip"
        unzip -q "$RUNNER_TEMP/sourcery.zip" -d "$RUNNER_TEMP/sourcery"
    - name: Tests failure reporting with generated mocks
      env:
        SOURCERY: ${{ runner.temp }}/sourcery/bin/sourcery
      run: bash Scripts/test-failure-reporting.sh
